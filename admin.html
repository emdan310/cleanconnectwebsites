<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanConnect Ops</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="ops-shell">
      <header class="ops-header">
        <div>
          <div class="brand-lockup" aria-label="CleanConnect">
            <span class="brand-mark" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </span>
            <h1 class="brand-wordmark"><span>Clean</span><strong>Connect</strong></h1>
          </div>
          <p>Business dashboard</p>
        </div>
        <div class="header-actions">
          <a class="student-link" href="index.html" target="_blank" rel="noopener noreferrer">Student app</a>
          <a class="student-link" href="cleaner.html" target="_blank" rel="noopener noreferrer">Cleaner portal</a>
        </div>
      </header>

      <nav class="ops-tabs" aria-label="Dashboard views">
        <button class="ops-tab active" type="button" data-view="log">Request log</button>
        <button class="ops-tab" type="button" data-view="schedule">Schedule</button>
        <button class="ops-tab" type="button" data-view="updates">Updates</button>
        <button class="ops-tab" type="button" data-view="cleaners">Cleaners</button>
      </nav>

      <section class="ops-view active" data-view-panel="log">
        <section class="metric-grid compact" aria-label="Request log totals">
          <article class="metric-card primary">
            <span>Total charges</span>
            <strong id="total-charges">$0</strong>
          </article>
          <article class="metric-card">
            <span>Total requests</span>
            <strong id="total-requests">0</strong>
          </article>
          <article class="metric-card">
            <span>Cleaning jobs</span>
            <strong id="cleaning-count">0</strong>
          </article>
        </section>

        <div class="section-heading">
          <div>
            <p>Incoming work</p>
            <h2>Request log</h2>
          </div>
          <span id="log-count">0 filed</span>
        </div>
        <div class="request-log" id="request-log"></div>
      </section>

      <section class="ops-view" data-view-panel="schedule">
        <section class="metric-grid compact schedule-metrics" aria-label="Schedule totals">
          <article class="metric-card primary">
            <span>Scheduled charges</span>
            <strong id="scheduled-charges">$0</strong>
          </article>
          <article class="metric-card">
            <span>Scheduled jobs</span>
            <strong id="scheduled-requests">0</strong>
          </article>
          <article class="metric-card">
            <span>Cleaning slots</span>
            <strong id="scheduled-cleaning-count">0</strong>
          </article>
        </section>

        <div class="section-heading">
          <div>
            <p>Calendar</p>
            <h2 id="calendar-month-label">Cleaning calendar</h2>
          </div>
          <div class="calendar-controls">
            <button type="button" id="calendar-prev">Prev</button>
            <button type="button" id="calendar-next">Next</button>
          </div>
        </div>
        <section class="calendar-card">
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
          </div>
          <div class="month-calendar" id="cleaning-calendar"></div>
        </section>
        <section class="calendar-detail hidden" id="calendar-detail"></section>
      </section>

      <section class="ops-view" data-view-panel="updates">
        <div class="section-heading">
          <div>
            <p>Activity feed</p>
            <h2>Updates</h2>
          </div>
          <span id="update-count">0 updates</span>
        </div>
        <div class="updates-list" id="updates-list"></div>
      </section>

      <section class="ops-view" data-view-panel="cleaners">
        <form class="cleaner-form" id="cleaner-form">
          <label>
            <span>Cleaner name</span>
            <input id="cleaner-name" type="text" placeholder="Add cleaner name" autocomplete="off" />
          </label>
          <label>
            <span>Photo</span>
            <input id="cleaner-photo" type="file" accept="image/*" />
          </label>
          <button type="submit">Add cleaner</button>
        </form>

        <div class="cleaner-list" id="cleaner-list"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-sync.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
