<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanConnect Cleaner Portal</title>
    <link rel="stylesheet" href="cleaner.css" />
  </head>
  <body>
    <main class="cleaner-shell">
      <section class="login-screen" id="login-screen">
        <header class="cleaner-header">
          <div>
            <div class="brand-lockup" aria-label="CleanConnect">
              <span class="brand-mark" aria-hidden="true">
                <span></span>
                <i></i>
                <span></span>
              </span>
              <h1 class="brand-wordmark"><span>Clean</span><strong>Connect</strong></h1>
            </div>
            <p>Cleaner sign in</p>
          </div>
        </header>

        <form class="login-card" id="login-form">
          <label>
            <span>Cleaner name</span>
            <input id="login-name" type="text" list="cleaner-options" placeholder="Your cleaner name" autocomplete="name" />
            <datalist id="cleaner-options"></datalist>
          </label>
          <label>
            <span>Passcode</span>
            <input id="login-passcode" type="password" placeholder="Enter passcode" autocomplete="current-password" />
          </label>
          <label>
            <span>Account email</span>
            <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" />
          </label>
          <label>
            <span>Account password</span>
            <input id="login-account-password" type="password" placeholder="Remember this device" autocomplete="current-password" />
          </label>
          <p class="login-error" id="login-error" aria-live="polite"></p>
          <button type="submit">Sign in</button>
        </form>
      </section>

      <section class="work-screen hidden" id="work-screen">
        <header class="cleaner-header">
          <div>
            <div class="brand-lockup" aria-label="CleanConnect">
              <span class="brand-mark" aria-hidden="true">
                <span></span>
                <i></i>
                <span></span>
              </span>
              <h1 class="brand-wordmark"><span>Clean</span><strong>Connect</strong></h1>
            </div>
            <p>Cleaner portal</p>
          </div>
          <button class="sign-out-button" type="button" id="sign-out-button">Sign out</button>
        </header>

        <nav class="cleaner-tabs" aria-label="Cleaner views">
          <button class="cleaner-tab active" type="button" data-cleaner-view="upcoming">Upcoming</button>
          <button class="cleaner-tab" type="button" data-cleaner-view="available">Available</button>
          <button class="cleaner-tab" type="button" data-cleaner-view="my-time">My time</button>
          <button class="cleaner-tab" type="button" data-cleaner-view="calendar">Calendar</button>
        </nav>

        <section class="cleaner-view active" data-cleaner-panel="upcoming">
          <section class="jobs-section">
            <div class="section-heading">
              <div>
                <p>Assigned work</p>
                <h2>Upcoming assignments</h2>
              </div>
              <span id="job-count">0 jobs</span>
            </div>
            <div class="job-list" id="job-list"></div>
          </section>
        </section>

        <section class="cleaner-view" data-cleaner-panel="available">
          <section class="availability-card">
            <div class="section-heading">
              <div>
                <p>Open cleanings</p>
                <h2>Available slots</h2>
              </div>
            </div>
            <div class="slot-strip" id="availability-slots"></div>
          </section>
        </section>

        <section class="cleaner-view" data-cleaner-panel="my-time">
          <div class="section-heading">
            <div>
              <p>Availability</p>
              <h2 id="availability-week-label">This week</h2>
            </div>
            <div class="calendar-controls">
              <button type="button" id="availability-prev">Prev</button>
              <button type="button" id="availability-next">Next</button>
            </div>
          </div>
          <section class="availability-editor" id="cleaner-availability-editor"></section>
        </section>

        <section class="cleaner-view" data-cleaner-panel="calendar">
          <div class="section-heading">
            <div>
              <p>Calendar</p>
              <h2 id="cleaner-calendar-month">Your schedule</h2>
            </div>
            <div class="calendar-controls">
              <button type="button" id="cleaner-calendar-prev">Prev</button>
              <button type="button" id="cleaner-calendar-next">Next</button>
            </div>
          </div>
          <div class="calendar-zoom" aria-label="Calendar zoom">
            <button type="button" data-calendar-zoom="day">Day</button>
            <button class="active" type="button" data-calendar-zoom="week">Week</button>
            <button type="button" data-calendar-zoom="month">Month</button>
          </div>
          <section class="cleaner-calendar-card">
            <div class="cleaner-calendar" id="cleaner-calendar"></div>
          </section>
          <section class="cleaner-calendar-detail hidden" id="cleaner-calendar-detail"></section>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-sync.js"></script>
    <script src="cleaner.js"></script>
  </body>
</html>
